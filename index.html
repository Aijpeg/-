const ser=(L,up)=>["# Тренажёр меню: база блюд","# Строка: ID|Группа|Название|ингредиенты через ;|для теста «Диетическое» (необязательно: без жарки или жарка)","#updated "+up,"#maxid "+Math.max(MAXID,...L.map(idn)),...L.map(d=>[d.id,d.c,d.n,d.i.join(";"),d.t||""].join("|").replace(/\|+$/,""))].join("\n")+"\n";
const nextId=L=>"d"+String(Math.max(MAXID,...L.map(idn))+1).padStart(2,"0");
function edDirty(){return !!E&&JSON.stringify(E.L)!=JSON.stringify(D)}
function edInit(L){E={L:clone(L),view:"list",cur:null,f:"",q:"",hi:0,m:[],msg:"",ok:0,del:0,ren:{from:"",to:""},txt:""}}
const edPool=()=>[...new Set(E.L.flatMap(d=>d.i))].sort((a,b)=>a.localeCompare(b,"ru"));
const cbm=(pool,q)=>{q=nz(q.trim());if(!q)return pool;const sc=x=>{const n=nz(x),k=n.indexOf(q);return k<0?-1:k==0?0:/[\s(]/.test(n[k-1])?1:2};return pool.map(x=>[x,sc(x)]).filter(a=>a[1]>=0).sort((a,b)=>a[1]-b[1]).map(a=>a[0])};
function edCheck(L){const er=[],ids=new Set(),nm=new Set();for(const d of L){if(!d.n)er.push("у блюда "+d.id+" нет названия");if(ids.has(d.id))er.push("повторяется ID "+d.id);ids.add(d.id);if(nm.has(nz(d.n)))er.push("два блюда с названием «"+d.n+"»");nm.add(nz(d.n));if(!d.i.length)er.push("в блюде «"+d.n+"» нет ингредиентов");if(!GR.includes(d.c))er.push("у блюда «"+d.n+"» не выбрана группа")}return er}
R.edit=()=>{stop();if(!CAN){go("cards");return}if(!E)edInit(D);drawE()};
function drawE(){const v=E.view,msg=E.msg?`<div class="card ${E.ok?"ok":"bad"}" style="padding:12px 16px">${E.msg}</div>`:"",dirty=edDirty(),back=`<button onclick="edBack()" style="margin-bottom:10px">← К списку</button>`;let h="";
if(v=="list")h=`<div class=card><h2>Редактор меню</h2><p class=m>База: ${DBSRC}${DBUP?" от "+DBUP:""} · блюд: ${E.L.length}. Остальные увидят правки только после «Сохранить для всех».</p></div>${msg}<div class=row style="margin-bottom:10px"><button onclick="edNew()">＋ Блюдо</button><button onclick="E.view='ren';E.msg='';drawE()">Ингредиент везде</button><button onclick="edTxt()">Текст базы</button></div><input id=ef placeholder="Найти блюдо или ингредиент" value="${esc(E.f)}" oninput="E.f=this.value;edRows()" autocomplete=off><div id=er></div><div class=row style="margin-top:12px"><button class=p onclick="edSave()" ${dirty?"":"disabled"}>Сохранить для всех</button><button onclick="edReset()" ${dirty?"":"disabled"}>Отменить правки</button></div>`;
else if(v=="dish"){const d=E.cur;h=`${back}${msg}<div class=card><label class=f for=en>Название</label><input id=en value="${esc(d.n)}" oninput="E.cur.n=this.value" autocomplete=off><label class=f for=eg>Группа</label><select id=eg class=w onchange="E.cur.c=this.value">${GR.includes(d.c)?"":`<option value="" selected>выбери группу</option>`}${GR.map(g=>`<option ${g==d.c?"selected":""}>${g}</option>`).join("")}</select><label class=f for=et>Тест «Диетическое»</label><select id=et class=w onchange="E.cur.t=this.value"><option value="" ${d.t?"":"selected"}>не участвует</option><option value="без жарки" ${d.t=="без жарки"?"selected":""}>без жарки на масле и фритюра</option><option value="жарка" ${d.t=="жарка"?"selected":""}>есть жарка или фритюр</option></select><label class=f>Состав · ${d.i.length}</label><div class=chips style="margin:0 0 12px">${d.i.map((x,k)=>`<button class=chip onclick="edRm(${k})">${esc(x)} ✕</button>`).join("")||`<span class=m>Пока пусто</span>`}</div><label class=f for=ei>Добавить ингредиент</label><input id=ei placeholder="Введи часть названия…" autocomplete=off autocapitalize=off spellcheck=false oninput="E.q=this.value;E.hi=0;eList()" onkeydown="eKey(event)"><div class=sug id=es></div></div><button onclick="edDel()" style="color:var(--bad)">${E.del?"Точно удалить блюдо?":"Удалить блюдо"}</button>`}
else if(v=="ren"){const p=edPool(),f=p.includes(E.ren.from)?E.ren.from:(p[0]||"");E.ren.from=f;h=`${back}${msg}<div class=card><h2 style="font-size:18px">Ингредиент везде</h2><p class=m>Заменяет название ингредиента сразу во всех блюдах. Если новое название уже есть в блюде, дубль не появится.</p><label class=f for=rf>Было</label><select id=rf class=w onchange="E.ren.from=this.value;edRC()">${p.map(x=>`<option ${x==f?"selected":""}>${esc(x)}</option>`).join("")}</select><p class=m id=rc></p><label class=f for=rt>Станет</label><input id=rt value="${esc(E.ren.to)}" oninput="E.ren.to=this.value" placeholder="Новое название" autocomplete=off><button class=p style="width:100%" onclick="edRen()">Заменить везде</button></div>`}
else h=`${back}${msg}<div class=card><h2 style="font-size:18px">Текст базы</h2><p class=m>Скопируй базу, поправь в блокноте и вставь обратно. «Применить текст» кладёт правки в черновик, после этого их нужно сохранить.</p><textarea id=et2 spellcheck=false rows=14></textarea><p class=m id=ecm></p><div class=row><button onclick="edCopy()">Скопировать</button><button class=p onclick="edApply()">Применить текст</button></div></div>`;
show(h);if(v=="list")edRows();else if(v=="dish")eList();else if(v=="ren")edRC();else{const t=$("#et2");if(t)t.value=E.txt}}
function edRows(){const e=$("#er");if(!e)return;const q=nz(E.f||""),ok=d=>!q||nz(d.n+" "+d.i.join(" ")).includes(q),mk=d=>{const o=D.find(x=>x.id==d.id);return !o?"＋ ":JSON.stringify(o)!=JSON.stringify(d)?"● ":""};
e.innerHTML=[...GR,"Без группы"].map(g=>{const ds=E.L.filter(d=>(g=="Без группы"?!GR.includes(d.c):d.c==g)&&ok(d));return ds.length?`<h3>${g} · ${ds.length}</h3>`+ds.map(d=>`<button class=erow onclick="edOpen('${d.id}')"><span>${mk(d)}${esc(d.n)}</span><span class=m>${d.i.length}</span></button>`).join(""):""}).join("")||`<p class=m>Ничего не найдено</p>`}
function edOpen(id){E.cur=E.L.find(d=>d.id==id);if(!E.cur)return;E.view="dish";E.q="";E.hi=0;E.msg="";E.del=0;drawE()}
function edBack(){E.view="list";E.cur=null;E.q="";E.msg="";E.del=0;drawE()}
function edNew(){const d={id:nextId(E.L),c:"Завтраки",n:"Новое блюдо",i:[],t:""};MAXID=Math.max(MAXID,idn(d));E.L.push(d);E.cur=d;E.view="dish";E.q="";E.hi=0;E.msg="";E.del=0;drawE();const i=$("#en");if(i){i.focus();i.select()}}
function edRm(k){E.cur.i.splice(k,1);E.msg="";drawE()}
function edDel(){if(!E.del){E.del=1;drawE();return}E.L=E.L.filter(d=>d!==E.cur);edBack()}
function eList(nav){const e=$("#es");if(!e)return;const q=E.q.trim(),cur=E.cur.i,m=cbm(edPool().filter(x=>!cur.includes(x)),E.q).slice(0,40),has=cur.concat(m).some(x=>nz(x)==nz(q)),it=m.map(t=>({t}));if(q&&!has&&clean(q))it.push({t:clean(q),n:1});E.m=it;E.hi=Math.max(0,Math.min(E.hi,it.length-1));
e.innerHTML=it.length?it.map((x,k)=>`<button class="${k==E.hi?"hi":""}" onmousedown="event.preventDefault()" onclick="eAdd(${k})">${x.n?`＋ Добавить «${esc(x.t)}» как новый`:hl(x.t,E.q)}</button>`).join(""):`<div class=m style="padding:10px 12px">${q?"Такой ингредиент уже в составе":"Начни вводить название"}</div>`;
if(nav&&e.querySelector){const h=e.querySelector(".hi");if(h&&h.scrollIntoView)h.scrollIntoView({block:"nearest"})}}
function eKey(e){const n=E.m.length;if(e.key=="ArrowDown"){e.preventDefault();E.hi=Math.min(E.hi+1,n-1);eList(1)}else if(e.key=="ArrowUp"){e.preventDefault();E.hi=Math.max(E.hi-1,0);eList(1)}else if(e.key=="Enter"){e.preventDefault();if(n)eAdd(E.hi)}else if(e.key=="Escape"){E.q="";E.hi=0;$("#ei").value="";eList()}}
function eAdd(k){const x=E.m[k];if(!x)return;const t=clean(x.t);if(t&&!E.cur.i.includes(t))E.cur.i.push(t);E.q="";E.hi=0;E.msg="";drawE();const i=$("#ei");if(i&&i.focus)i.focus({preventScroll:true})}
function edRC(){const e=$("#rc");if(e)e.textContent="Встречается в блюдах: "+E.L.filter(d=>d.i.includes(E.ren.from)).length}
function edRen(){const f=E.ren.from,t=clean(E.ren.to||"");if(!f)return;if(!t||t==f){E.msg=t?"Новое название совпадает со старым":"Введи новое название";E.ok=0;return drawE()}let n=0;E.L.forEach(d=>{if(d.i.includes(f)){d.i=[...new Set(d.i.map(x=>x==f?t:x))];n++}});E.msg=`«${esc(f)}» → «${esc(t)}»: заменено в блюдах: ${n}`;E.ok=1;E.ren={from:t,to:""};drawE()}
function edTxt(){E.view="txt";E.msg="";E.txt=ser(E.L,ymd());drawE()}
async function edCopy(){const t=$("#et2");if(!t)return;t.focus();t.select();let m;try{await navigator.clipboard.writeText(t.value);m="Скопировано."}catch(e){m="Автоматически не скопировалось: текст выделен, нажми Ctrl+C."}const c=$("#ecm");if(c)c.textContent=m}
function edApply(){const t=$("#et2");if(!t)return;const p=parseDB(t.value),er=p.L.length?edCheck(p.L):["в тексте нет ни одного блюда"];if(er.length){E.msg="Текст не применён: "+er.map(esc).join("; ");E.ok=0;E.txt=t.value;return drawE()}E.L=clone(p.L);MAXID=Math.max(MAXID,p.mx,...p.L.map(idn));E.view="list";E.msg="Текст применён. Проверь список и нажми «Сохранить для всех».";E.ok=1;drawE()}
function edReset(){edInit(D);E.msg="Правки отменены";E.ok=1;drawE()}
async function edSave(){E.L.forEach(d=>{d.n=clean(d.n);d.c=clean(d.c);d.t=clean(d.t||"");d.i=[...new Set(d.i.map(clean).filter(Boolean))]});
const er=edCheck(E.L);if(er.length){E.msg="Нельзя сохранить: "+er.map(esc).join("; ");E.ok=0;return drawE()}if(!edDirty()){E.msg="Нет изменений";E.ok=1;return drawE()}
let art=null;try{art=await window.claude.use("artifact")}catch(e){}
if(!art){E.msg="Сохранение недоступно в этом окне. Открой «Текст базы», скопируй его и пришли Claude.";E.ok=0;return drawE()}
const up=ymd(),text=ser(E.L,up);try{sessionStorage.setItem("mtdraft",text)}catch(e){}
try{await art.publish({"menu.txt":{content:text,contentType:"text/plain"}});const p=parseDB(text);setDB(p.L,up,p.mx);DBSRC="файл menu.txt";try{sessionStorage.removeItem("mtdraft")}catch(e){}edInit(D);E.msg="Сохранено для всех ✓ Остальные увидят новую базу после обновления страницы.";E.ok=1;drawE()}
catch(e){const c=e&&e.code;if(c!="conflict")try{sessionStorage.removeItem("mtdraft")}catch(x){}E.msg=c=="not_writer"||c=="not_granted"?"У тебя нет права сохранять эту страницу.":c=="capability_disabled"?"Сохранение из страницы недоступно для этой ссылки. Открой «Текст базы», скопируй его и пришли Claude.":c=="conflict"?"Страницу обновили, пока ты редактировал. Окно перезагрузится, правки восстановятся.":c=="rate_limited"?"Слишком часто. Подожди минуту и сохрани снова.":"Не удалось сохранить: "+esc((e&&e.message)||"ошибка")+". Правки остались в черновике.";E.ok=0;drawE()}}
const addTab=()=>{const t=document.querySelector(".tabs");if(t&&!t.querySelector("[data-ed]"))t.insertAdjacentHTML("beforeend",`<button data-ed onclick="go('edit')">Редактор</button>`)};
const xhrText=u=>new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open("GET",u);x.onload=()=>ok(x.responseText||null);x.onerror=()=>no(0);x.send()});
async function loadMenu(){try{const g=location.protocol=="file:"?xhrText("menu.txt"):fetch("menu.txt",{cache:"no-store"}).then(r=>r.ok?r.text():null);return await Promise.race([g,new Promise((_,j)=>setTimeout(()=>j(0),2500))])}catch(e){return null}}
(async()=>{const p0=parseDB(DB0);setDB(p0.L,p0.up,p0.mx);
const t=await loadMenu();if(t){const p=parseDB(t);if(p.L.length){setDB(p.L,p.up,p.mx);DBSRC="файл menu.txt"}}
R[mode]();
try{const u=window.claude&&window.claude.use?await window.claude.use("user"):null;CAN=!!(u&&await u.canEdit())}catch(e){CAN=false}
if(CAN){addTab();try{const d=sessionStorage.getItem("mtdraft");if(d){sessionStorage.removeItem("mtdraft");const p=parseDB(d);if(p.L.length){edInit(p.L);E.msg="Восстановлены несохранённые правки. Проверь и нажми «Сохранить для всех».";E.ok=1;go("edit")}}}catch(e){}}})();
</script>
